<style>
/* Layout: a two-ink screenprint pinned to a wall. Blue photographs, thin red threads with arrowheads, tiny bold red captions on pink highlight, one red disc as the core idea. Inspector and Language view use the same two inks on paper. */
:root{
  --wall:#cbcbc8; --paper:#f6f5f1; --blue:#2a24a6; --red:#e4414b; --hl:#f8c9cc; --text:#25224a; --mute:#7a789a; --line:#cfcde0; --pin:#9a9a9f;
  --duo-bg:#2a24a6; --duo-blend:screen; --fld:#fffefb;
  --f-sans:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-type:'Courier Prime','Courier New',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#08080d;--paper:#14131d;--blue:#9d97ff;--red:#ff6b74;--hl:#4b2331;--text:#e9e8fb;--mute:#8c8aab;--line:#2c2a42;--pin:#55555d;--duo-bg:#9d97ff;--duo-blend:multiply;--fld:#1b1a28;color-scheme:dark}}
:root[data-theme="dark"]{--wall:#08080d;--paper:#14131d;--blue:#9d97ff;--red:#ff6b74;--hl:#4b2331;--text:#e9e8fb;--mute:#8c8aab;--line:#2c2a42;--pin:#55555d;--duo-bg:#9d97ff;--duo-blend:multiply;--fld:#1b1a28;color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--text);font:13px/1.45 var(--f-sans);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:9px 16px;background:var(--paper);border-bottom:1px solid var(--blue)}
.brand{font:800 19px/1 var(--f-sans);letter-spacing:-.03em;color:var(--blue);display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--red)}
.grp{display:flex;border:1px solid var(--blue)}
.grp button{border:0;border-right:1px solid var(--blue);background:none;padding:5px 10px;font:600 11px var(--f-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--blue);display:flex;gap:6px;align-items:center}
.grp button:last-child{border-right:0}
.grp button kbd{font:400 9px var(--f-type);opacity:.7}
.grp button[aria-pressed="true"]{background:var(--blue);color:var(--paper)}
.btn{border:1px solid var(--blue);background:none;padding:5px 10px;font:600 11px var(--f-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.btn:hover{background:var(--hl)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--paper)}
.btn.pri:hover{filter:brightness(1.08)}
.btn[aria-pressed="true"]{background:var(--blue);color:var(--paper)}
.btn:disabled{opacity:.5;cursor:default}
.sp{flex:1}
.hint{font:400 11px var(--f-type);color:var(--mute)}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
main.lv{display:block}
main.lv #lang{height:100%}
#stage{position:relative;overflow:hidden;min-height:0;touch-action:none;cursor:grab;background:var(--wall)}
#stage.picking{cursor:crosshair}#stage.tagging{cursor:crosshair}#stage.linking{cursor:alias}#stage.hubbing{cursor:copy}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.sheet,.sheet *{user-select:none}
.sheet{position:absolute;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.25),0 22px 50px -18px rgba(0,0,0,.45)}
.pin{position:absolute;top:10px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--pin) 60%,#555);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.vert{position:absolute;left:14px;bottom:20px;writing-mode:vertical-rl;transform:rotate(180deg);font:400 9px var(--f-type);letter-spacing:.12em;color:var(--blue);text-transform:uppercase;white-space:nowrap}
#threads{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;width:1px;height:1px;z-index:10}
.ref{position:absolute}
.ref .cap{height:27px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 1px;font:400 10px var(--f-type);letter-spacing:.04em;color:var(--red);cursor:move;user-select:none}
.ref .cap b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref .cap button{border:0;background:none;color:var(--red);padding:0 2px;opacity:0;font-size:14px;line-height:1}
.ref:hover .cap button{opacity:1}
.ref .img{position:relative;overflow:hidden;line-height:0;background:var(--duo-bg)}
.ref .img.cropping{overflow:visible}
.ref img{position:absolute;display:block;max-width:none;height:auto;user-select:none;-webkit-user-drag:none;filter:grayscale(1) contrast(1.15) brightness(1.05);mix-blend-mode:var(--duo-blend)}
.orig .ref .img{background:none}
.orig .ref img{filter:none;mix-blend-mode:normal}
.tag{position:absolute;border:1.5px solid var(--red)}
.tag .lbl{position:absolute;left:-1.5px;top:100%;margin-top:4px;white-space:nowrap;font:800 8.5px/1.25 var(--f-sans);letter-spacing:.02em;color:var(--red);background:var(--hl);padding:1px 4px;pointer-events:none;text-transform:uppercase}
.tag.sel{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--red)}
.tag.pend{box-shadow:0 0 0 2px var(--paper),0 0 0 5px var(--red)}
.draw{position:absolute;border:1.5px dashed var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.hub{z-index:8;position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--red);cursor:move;display:flex;justify-content:center}
.hub .lbl{position:absolute;top:100%;margin-top:5px;white-space:nowrap;font:800 9px/1.25 var(--f-sans);color:var(--red);background:var(--hl);padding:1px 5px;text-transform:uppercase;pointer-events:none}
.hub.sel{box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--red)}
.hub.pend{box-shadow:0 0 0 3px var(--paper),0 0 0 7px var(--red)}
.thread{fill:none;stroke:var(--red);stroke-width:1.2}
.thread.sel{stroke-width:2.4}
.thread-lbl{font:800 8.5px var(--f-sans);fill:var(--red);paint-order:stroke;stroke:var(--hl);stroke-width:6px;stroke-linejoin:round;text-transform:uppercase;letter-spacing:.02em}
.ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--paper);pointer-events:none}
aside{background:var(--paper);border-left:1px solid var(--blue);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-width:0}
h2{font:800 16px var(--f-sans);margin:0;letter-spacing:-.02em;color:var(--blue)}
.eyebrow{font:600 9.5px var(--f-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld input,.fld select,.fld textarea,.row input,.row select{width:100%;background:var(--fld);border:1px solid var(--line);padding:6px 8px;border-radius:0}
.fld textarea{resize:vertical;min-height:56px;font:400 12px var(--f-type)}
.row{display:flex;gap:6px;min-width:0}
.sw{display:flex;flex-wrap:wrap}
.sw span{width:36px;height:36px;cursor:pointer;position:relative}
.sw span:hover::after{content:attr(data-hex);position:absolute;left:0;top:40px;font:400 10px var(--f-type);background:var(--blue);color:var(--paper);padding:2px 5px;z-index:3;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}
.stats div{padding:6px 8px;border-right:1px solid var(--line)}.stats div:last-child{border-right:0}
.stats b{display:block;font:700 12px var(--f-type);margin-top:2px;color:var(--text);text-transform:none;letter-spacing:0}
.read{border:1px solid var(--blue);padding:12px;display:flex;flex-direction:column;gap:12px}
.read dl{margin:0;display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px 10px}
.read dt{font:600 9.5px var(--f-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--red);padding-top:3px}
.read dd{margin:0;min-width:0;overflow-wrap:anywhere}
.specimen{font-size:26px;line-height:1.1;margin:4px 0 2px;color:var(--blue)}
.words{display:flex;flex-wrap:wrap;gap:4px}
.words span{background:var(--hl);color:var(--red);font:800 9.5px var(--f-sans);text-transform:uppercase;letter-spacing:.04em;padding:2px 6px}
.words span.px{background:none;border:1px solid var(--line);color:var(--mute);font-weight:600}
.small{font:400 11px/1.4 var(--f-type);color:var(--mute)}
.wheel{flex:none}
.chips{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.chip{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line);padding:6px 0}
.chip em{font:600 9.5px var(--f-sans);font-style:normal;text-transform:uppercase;letter-spacing:.1em;color:var(--red);padding-top:3px;flex:none;width:54px}
.chip span{flex:1;min-width:0;overflow-wrap:anywhere;font:400 12px var(--f-type)}
.chip button{border:0;background:none;color:var(--mute)}
.empty{color:var(--mute);border:1px dashed var(--line);padding:12px;font:400 12px var(--f-type)}
.linkrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:6px 0;cursor:pointer}
.linkrow b{font:800 10px var(--f-sans);text-transform:uppercase;color:var(--blue)}
.linkrow:hover b{color:var(--red)}
#lang{overflow:auto;padding:22px 16px;min-height:0;background:var(--paper)}
.langwrap{max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:20px}
.fam{border:1px solid var(--blue);display:flex;flex-direction:column;min-width:0}
.fam .bands{display:flex;height:70px}.fam .bands span{flex:1}
.fam .in{padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fam input.fn{font:800 20px var(--f-sans);border:0;background:none;padding:0;width:100%;letter-spacing:-.02em;color:var(--blue)}
.tagl{display:flex;flex-wrap:wrap;gap:5px}
.tagl span{font:800 9px var(--f-sans);text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--red);color:var(--red);padding:1px 6px}
.rules{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.rules li{display:flex;gap:8px;border-bottom:1px solid var(--line);padding:5px 0}
.rules li em{font:600 9.5px var(--f-sans);font-style:normal;text-transform:uppercase;letter-spacing:.1em;color:var(--red);flex:none;width:58px;padding-top:2px}
.rules li span{font:400 12px var(--f-type);min-width:0;overflow-wrap:anywhere}
.spec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:4px 0}
.spec .s{font-size:22px;color:var(--blue);line-height:1.15}

.ref.sel .cap b{color:var(--blue);font-weight:700}
.ref .cap .sch{margin-left:auto;font:600 8px var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.ref .cap{justify-content:flex-start}
.ref .cap button{margin-left:4px}
.ref.sel .img{outline:1.5px solid var(--blue);outline-offset:2px}
.rh{position:absolute;width:calc(12px*var(--iz,1));height:calc(12px*var(--iz,1));background:var(--paper);border:calc(1.5px*var(--iz,1)) solid var(--blue);z-index:4}
.ref:not(.sel) .rh{display:none}
.rh[data-rh=nw]{left:calc(-6px*var(--iz,1));top:calc(27px - 6px*var(--iz,1));cursor:nwse-resize}.rh[data-rh=ne]{right:calc(-6px*var(--iz,1));top:calc(27px - 6px*var(--iz,1));cursor:nesw-resize}
.rh[data-rh=sw]{left:calc(-6px*var(--iz,1));bottom:calc(-6px*var(--iz,1));cursor:nesw-resize}.rh[data-rh=se]{right:calc(-6px*var(--iz,1));bottom:calc(-6px*var(--iz,1));cursor:nwse-resize}
.dim{position:absolute;background:color-mix(in srgb,var(--paper) 72%,transparent);pointer-events:none}
.cropbox{position:absolute;border:1.5px dashed var(--red);cursor:move;z-index:3}
.cropbox::before,.cropbox::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--red),var(--red)) 33.3% 0/1px 100% no-repeat,linear-gradient(var(--red),var(--red)) 66.6% 0/1px 100% no-repeat;opacity:.45}
.cropbox::after{background:linear-gradient(var(--red),var(--red)) 0 33.3%/100% 1px no-repeat,linear-gradient(var(--red),var(--red)) 0 66.6%/100% 1px no-repeat}
.ch{position:absolute;width:calc(14px*var(--iz,1));height:calc(14px*var(--iz,1));background:var(--paper);border:calc(2px*var(--iz,1)) solid var(--red);transform:translate(-50%,-50%)}
.ch[data-ch=nw]{left:0;top:0;cursor:nwse-resize}.ch[data-ch=n]{left:50%;top:0;cursor:ns-resize}.ch[data-ch=ne]{left:100%;top:0;cursor:nesw-resize}
.ch[data-ch=e]{left:100%;top:50%;cursor:ew-resize}.ch[data-ch=se]{left:100%;top:100%;cursor:nwse-resize}.ch[data-ch=s]{left:50%;top:100%;cursor:ns-resize}
.ch[data-ch=sw]{left:0;top:100%;cursor:nesw-resize}.ch[data-ch=w]{left:0;top:50%;cursor:ew-resize}
#dock{position:absolute;left:0;right:0;bottom:0;max-height:52%;background:var(--paper);border-top:1px solid var(--blue);padding:10px 14px;display:flex;gap:26px;align-items:flex-start;overflow:auto;z-index:20;cursor:default}
#dock[hidden]{display:none}
.dk{display:flex;flex-direction:column;gap:6px;flex:none;min-width:0}
.dk .row{align-items:center}
.pcs{display:flex;gap:3px}
.pc{display:flex;flex-direction:column;width:48px}
.pc .blk{height:36px;border:0;padding:0;cursor:pointer}
.pc .hx{font:400 9px var(--f-type);border:0;background:none;padding:3px 0 0;text-align:left;color:var(--mute)}
.pc .hx:hover{color:var(--red)}
.pc.pinned .blk{outline:2px solid var(--red);outline-offset:-3px}
.pcs.sm .pc{width:34px}.pcs.sm .blk{height:24px}.pcs.sm .hx{display:none}
.rfs{display:flex;flex-direction:column;gap:4px;min-width:200px}
.rfl{display:flex;align-items:center;gap:8px;cursor:pointer}
.rfl b{font:600 10px var(--f-sans);text-transform:uppercase;letter-spacing:.04em;color:var(--blue);width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rfl em{font:400 9px var(--f-type);font-style:normal;color:var(--mute);width:104px;white-space:nowrap}
.minis{display:flex}.minis i{width:14px;height:14px;display:block}

.port{position:absolute;right:calc(-8px*var(--iz,1));top:50%;width:calc(14px*var(--iz,1));height:calc(14px*var(--iz,1));margin-top:calc(-7px*var(--iz,1));border-radius:50%;background:var(--red);border:calc(2px*var(--iz,1)) solid var(--paper);cursor:crosshair;display:none;z-index:6}

.cmd{flex-basis:100%;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:7px;position:relative}

#cmd{flex:1;min-width:0;border:0;background:none;font:400 13px var(--f-type);color:var(--text);outline:none;padding:2px 0}

.cmd .hint{max-width:46%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sug{position:absolute;left:18px;top:100%;margin-top:2px;min-width:min(440px,calc(100% - 36px));background:var(--paper);border:1px solid var(--blue);z-index:60;box-shadow:0 12px 24px -12px rgba(0,0,0,.4)}

.sg{display:flex;gap:12px;padding:5px 10px;cursor:pointer;font:400 12px var(--f-type)}

.sg.on,.sg:hover{background:var(--hl)}
#help{position:absolute;right:12px;top:12px;max-width:min(400px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--paper);border:1px solid var(--blue);padding:12px;z-index:30;cursor:pointer}

.hl{display:flex;gap:10px;padding:3px 0;font:400 11px/1.35 var(--f-type)}.hl b{width:64px;flex:none;color:var(--blue);font-weight:700}.hl span{color:var(--mute)}
.spot{position:absolute;border:1.5px dashed var(--red);background:color-mix(in srgb,var(--red) 9%,transparent);pointer-events:none}

.bend{fill:var(--paper);stroke:var(--red);cursor:grab;pointer-events:all}

/* ===== Tracery v3: header rows, views, library, items, modal, presentation ===== */
.bar{gap:8px 0;padding:0}
.hrow{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px}
.hrow+.hrow{padding-top:0}
.pname{font:800 14px var(--f-sans);letter-spacing:-.01em;color:var(--blue);border:0;border-bottom:1px solid var(--line);background:none;padding:3px 2px;width:190px;max-width:100%}
.pname:focus{border-bottom-color:var(--red);outline:none}
.dsel{border:1px solid var(--blue);background:none;color:var(--blue);font:600 11px var(--f-sans);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;max-width:200px;border-radius:0}
.cmd{padding:7px 16px 8px;margin:0;border-top:1px solid var(--line)}
.grp button:disabled{opacity:.35;cursor:default}
.lbl2{font:600 9.5px var(--f-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

main>section.view{height:100%;overflow:auto;background:var(--paper);min-height:0}

/* toast */
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:var(--blue);color:var(--paper);font:400 12px var(--f-type);padding:8px 12px;max-width:min(560px,92vw);pointer-events:auto;display:flex;gap:12px;align-items:center}
.tst button{background:none;border:1px solid var(--paper);color:var(--paper);font:600 10px var(--f-sans);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px}

/* modal */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--text) 45%,transparent);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px 14px;overflow:auto}

.mbox{background:var(--paper);border:1px solid var(--blue);width:min(640px,100%);display:flex;flex-direction:column;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h2{flex:1}
.mbody{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 16px}
.tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:9px 12px;font:600 11px var(--f-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}

.drop{border:1px dashed var(--blue);padding:26px 14px;text-align:center;color:var(--mute);font:400 12px var(--f-type)}

.mrow{display:flex;gap:8px;align-items:center;min-width:0}

.tin,.fld input.tin,select.tin,textarea.tin{background:var(--fld);border:1px solid var(--line);padding:6px 8px;border-radius:0;width:100%}
textarea.tin{font:400 12px var(--f-type);resize:vertical;min-height:56px}
.note-box{border-left:2px solid var(--red);padding:2px 0 2px 10px;font:400 11px/1.45 var(--f-type);color:var(--mute)}
.pickl{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:46vh;overflow:auto}
.pk{border:1px solid var(--line);background:none;padding:0;text-align:left;display:flex;flex-direction:column;position:relative}
.pk img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pk span{font:400 10px/1.3 var(--f-type);padding:3px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}

/* items on the board */

.it-note.c-pink{background:var(--hl)}.it-note.c-paper{background:var(--paper)}.it-note.c-blue{background:color-mix(in srgb,var(--blue) 14%,var(--paper));border-color:var(--blue);box-shadow:3px 3px 0 color-mix(in srgb,var(--blue) 30%,transparent)}

.pcrow{display:flex}
.pcrow span{flex:1;min-width:0}
.pcrow i{display:block;height:44px}
.pcrow b{display:block;font:400 8px/1.3 var(--f-type);color:var(--text);padding-top:3px;overflow:hidden;text-overflow:ellipsis}
.it-section{z-index:0;border:1.5px dashed var(--blue);background:color-mix(in srgb,var(--blue) 4%,transparent)}
.it-section .tx{position:absolute;left:0;top:0;transform:translateY(-100%);margin-top:-3px;font:800 10px var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--blue);background:var(--paper);padding:2px 6px;white-space:nowrap}

.ih{position:absolute;right:calc(-6px*var(--iz,1));bottom:calc(-6px*var(--iz,1));width:calc(12px*var(--iz,1));height:calc(12px*var(--iz,1));background:var(--paper);border:calc(1.5px*var(--iz,1)) solid var(--blue);cursor:nwse-resize;display:none;z-index:6}

.marq{position:absolute;border:1px dashed var(--blue);background:color-mix(in srgb,var(--blue) 8%,transparent);pointer-events:none;z-index:50}
.addrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* library */
.lbwrap{display:grid;grid-template-columns:230px minmax(0,1fr) 360px;height:100%;min-height:0}

.lbdet{border-left:1px solid var(--blue);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.lc{display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0}

.lc.sel .th{outline:2px solid var(--red);outline-offset:2px}
.lc b{font:800 10px/1.25 var(--f-sans);text-transform:uppercase;letter-spacing:.03em;color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc small{font:400 10px/1.3 var(--f-type);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.lc .bd{position:absolute;left:0;top:0;display:flex;gap:2px;line-height:1.2}
.lc .bd span{background:var(--red);color:var(--paper);font:800 8px var(--f-sans);letter-spacing:.06em;padding:1px 4px;text-transform:uppercase}
.lc .plus{position:absolute;right:4px;bottom:4px;opacity:0;background:var(--paper);border:1px solid var(--blue);color:var(--blue);font:800 9px var(--f-sans);text-transform:uppercase;letter-spacing:.06em;padding:3px 6px}
.lc:hover .plus,.lc:focus-within .plus,.lc.sel .plus{opacity:1}
.fl{display:flex;flex-direction:column;gap:5px;min-width:0}
.qk{display:flex;flex-wrap:wrap;gap:4px}
.qk button,.chipb{border:1px solid var(--line);background:none;font:600 10px var(--f-sans);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:3px 8px}
.qk button[aria-pressed="true"],.chipb[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.chipb.red[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.chipw{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.tgchip{display:inline-flex;align-items:center;gap:4px;background:var(--hl);color:var(--red);font:800 9.5px var(--f-sans);text-transform:uppercase;letter-spacing:.04em;padding:2px 4px 2px 7px}
.tgchip button{border:0;background:none;color:var(--red);padding:0 2px;font-size:12px;line-height:1}
.preview{background:var(--duo-bg);line-height:0;position:relative}
.preview img{width:100%;max-height:280px;object-fit:contain;display:block;background:var(--wall)}
.pal-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 8px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}

.lbfil select,.lbfil input[type=search],.lbtop input[type=search]{width:100%;background:var(--fld);border:1px solid var(--line);padding:6px 8px;border-radius:0}
.cl{display:flex;flex-direction:column}

/* directions */
.dwrap{padding:22px 16px;display:flex;flex-direction:column;gap:20px;max-width:100%}
.dcols{display:flex;gap:18px;overflow:auto;align-items:flex-start;padding-bottom:12px}

.dcol .bands{display:flex;height:54px}.dcol .bands span{flex:1}

.dcol input.dn{font:800 19px var(--f-sans);border:0;background:none;padding:0;width:100%;letter-spacing:-.02em;color:var(--blue)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.thumbs div{background:var(--duo-bg);line-height:0}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;display:block;filter:grayscale(1) contrast(1.15);mix-blend-mode:var(--duo-blend)}
.orig .thumbs img{filter:none;mix-blend-mode:normal}
.stat{display:inline-block;font:800 9px var(--f-sans);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--blue);color:var(--blue)}
.stat.approved{background:var(--blue);color:var(--paper)}.stat.review{border-color:var(--red);color:var(--red)}
.trow{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:6px;align-items:center}

.ana{border:1px solid var(--blue);padding:12px;display:flex;flex-direction:column;gap:10px}

.ana ul{margin:0;padding-left:16px;font:400 12px/1.5 var(--f-type)}

/* brief */
.bwrap{max-width:1040px;margin-inline:auto;padding:24px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 28px}

.terr{border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}

/* presentation */
#present{position:fixed;inset:0;z-index:250;background:#101014;display:flex;flex-direction:column}

.pbar .btn.pri{background:#e4414b;border-color:#e4414b;color:#fff}
.pbar select{background:#101014;color:#e9e8fb;border:1px solid #9d97ff;padding:4px 6px;font:600 11px var(--f-sans);border-radius:0}

.pbar .hint{color:#8c8aab}
.pstage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pscale{width:1280px;height:720px;transform-origin:0 0;position:absolute;left:0;top:0}

.pdots button[aria-current="true"]{background:#e4414b}
.sl{--sp:#f6f5f1;--sb:#2a24a6;--sr:#e4414b;--st:#25224a;--sm:#7a789a;--sl:#cfcde0;--sh:#f8c9cc;
  width:1280px;height:720px;background:var(--sp);color:var(--st);position:relative;overflow:hidden;font:400 16px/1.45 'Archivo','Helvetica Neue',Arial,sans-serif}
.sl *{box-sizing:border-box}

.sl .foot{position:absolute;left:56px;right:56px;bottom:26px;display:flex;justify-content:space-between;font:400 12px 'Courier Prime','Courier New',monospace;color:var(--sm);letter-spacing:.06em;text-transform:uppercase}

.sl .rc2 .tk{font:400 12px/1.35 'Courier Prime','Courier New',monospace;color:var(--st)}
.sl .rc2 .cr{font:400 10px/1.3 'Courier Prime','Courier New',monospace;color:var(--sm)}

.ghost{pointer-events:none}
.cmp{border-collapse:collapse;width:100%;font:400 12px var(--f-type);min-width:520px}.cmp td,.cmp th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}.cmp th{font:800 11px var(--f-sans);color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.cmpw{overflow:auto}.miniband{display:flex;height:18px;min-width:90px}.miniband span{flex:1}
.plist{display:flex;flex-direction:column}.plist .pr2{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.plist .pr2 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--blue)}

[hidden]{display:none!important}
#app{grid-template-columns:minmax(0,1fr)}
.hrow>*{min-width:0}
.grp{max-width:100%;overflow-x:auto;scrollbar-width:none}
.grp::-webkit-scrollbar{display:none}
.grp button{flex:none}
.cmd{min-width:0}.cmd input{min-width:0}
@media (max-width:560px){.pname{width:100%;order:-1}.hrow{padding:6px 12px}.cmd .hint{display:none}}
.hrow,.cmd,.bar{box-sizing:border-box;max-width:100%}
@media (max-width:700px){#tb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#tb>*{flex:none}.brand{display:none}#views{order:5}}

/* ===== Tracery v4 visual direction: soft, rounded, image-led. Light and dark. ===== */
:root{
  --paper:#efeeec;--card:#ffffff;--wall:#e8e7e4;--blue:#17171a;--red:#e8400c;--hl:#ffe27a;--text:#1d1d20;--mute:#68676f;--line:#dedcd8;--pin:#9a9a9f;
  --duo-bg:#17171a;--duo-blend:screen;--fld:#ffffff;--cream:#fff1c9;--yel:#ffd21f;--pnk:#ff5c9d;--dot:#cfcdc8;
  --shadow:0 1px 2px rgba(20,20,25,.06),0 12px 32px -14px rgba(20,20,25,.22);
  --f-sans:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;--f-type:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;--f-mono:'DM Mono',ui-monospace,'Courier New',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121214;--card:#1b1b1f;--wall:#0c0c0e;--blue:#f3ece0;--red:#ff7a45;--hl:#4a3b12;--text:#ecebe8;--mute:#9b99a3;--line:#2d2d33;--pin:#55555d;
  --duo-bg:#f3ece0;--duo-blend:multiply;--fld:#1b1b1f;--cream:#f3ece0;--yel:#ffc21f;--dot:#26262b;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121214;--card:#1b1b1f;--wall:#0c0c0e;--blue:#f3ece0;--red:#ff7a45;--hl:#4a3b12;--text:#ecebe8;--mute:#9b99a3;--line:#2d2d33;--pin:#55555d;
  --duo-bg:#f3ece0;--duo-blend:multiply;--fld:#1b1b1f;--cream:#f3ece0;--yel:#ffc21f;--dot:#26262b;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7);color-scheme:dark}
body{letter-spacing:-.005em}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
.bar{background:var(--paper);border-bottom:0;padding:0}
.hrow{padding:10px 18px 4px;gap:10px 12px}
.brand{font:800 20px/1 var(--f-sans);letter-spacing:-.04em;color:var(--blue)}
.brand::before{width:16px;height:16px;background:var(--red);box-shadow:7px 4px 0 -2px var(--yel)}
.pwrap{display:flex;align-items:center;gap:2px}
.pname{border:0;border-bottom:0;border-radius:10px;padding:7px 10px;width:200px;font:700 14px var(--f-sans);color:var(--text);background:transparent}
.pname:hover{background:var(--card)}.pname:focus{background:var(--card);box-shadow:0 0 0 2px var(--red);outline:none}
.grp{border:1px solid var(--line);border-radius:999px;background:var(--card);padding:3px;gap:2px;box-shadow:none}
.grp button{border:0;border-right:0;border-radius:999px;padding:7px 13px;font:600 12.5px var(--f-sans);letter-spacing:0;text-transform:none;color:var(--text);background:none}
.grp button:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}
.grp button[aria-pressed="true"]{background:var(--blue);color:var(--paper)}
.grp button.ib{padding:7px 9px}
.btn{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);font:600 12.5px var(--f-sans);letter-spacing:0;text-transform:none;padding:8px 15px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:color-mix(in srgb,var(--text) 7%,var(--card))}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.btn.pri:hover{filter:none;background:color-mix(in srgb,var(--blue) 82%,var(--red))}
.btn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.btn.ic{padding:8px;width:36px;height:36px;justify-content:center}
.btn:focus-visible,.grp button:focus-visible,#ftb button:focus-visible,#zoombar button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.dlab{font:700 11px var(--f-sans);color:var(--mute)}
.dsel,select{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);font:600 12.5px var(--f-sans);text-transform:none;letter-spacing:0;padding:8px 12px;max-width:190px}
.fld select,.row select,select.tin,.lbfil select{border-radius:10px;font:500 12.5px var(--f-sans);max-width:none}
input,textarea{border-radius:10px}
.fld input,.fld select,.fld textarea,.row input,.row select,.tin,.lbfil select,.lbfil input[type=search],.lbtop input[type=search]{background:var(--fld);border:1px solid var(--line);border-radius:10px}
.fld textarea,textarea.tin{font:400 13px/1.45 var(--f-sans)}
.eyebrow{font:700 10.5px var(--f-sans);letter-spacing:.08em;color:var(--mute)}
.cmd{margin:6px 18px 12px;padding:5px 8px 5px 16px;background:var(--card);border:1px solid var(--line);border-radius:999px;flex-basis:auto;width:calc(100% - 36px)}
.cmd:focus-within{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent)}
.cmd input{font:500 13px var(--f-sans);border:0;background:none;outline:none;padding:6px 4px}
.cmd .pr{color:var(--red);font:800 18px/1 var(--f-sans)}
.hint,.small{font:500 11.5px/1.4 var(--f-sans);color:var(--mute)}
#sug{border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;top:calc(100% + 6px)}
.sg{font:500 12.5px var(--f-sans);padding:7px 14px}.sg.on,.sg:hover{background:color-mix(in srgb,var(--yel) 30%,var(--card))}
/* canvas */
main{gap:0;padding:0 12px 12px;background:var(--paper)}
#stage{border-radius:22px;border:1px solid var(--line);background-color:var(--wall);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:24px 24px}
#stage .sheet{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.pin,.vert{display:none}
aside{background:var(--card);border-left:0;border-radius:22px;margin-left:12px;border:1px solid var(--line);padding:18px}
h2{color:var(--text);font:800 17px var(--f-sans);letter-spacing:-.03em}
main.lv{padding:0 12px 12px}
main>section.view{background:var(--card);border:1px solid var(--line);border-radius:22px}
#lang{border-radius:22px}
.ref .cap{font:600 11px var(--f-sans);letter-spacing:0;color:var(--mute);text-transform:none}
.ref .cap button{color:var(--mute)}
.ref .img{border-radius:12px;background:var(--duo-bg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 20px -12px rgba(0,0,0,.35)}
.ref .img.cropping{border-radius:0}
.ref.sel .img{outline:2px solid var(--red);outline-offset:3px}
.tag{border-radius:4px;border-color:var(--red)}
.tag .lbl,.hub .lbl{color:var(--text);background:var(--hl);border-radius:5px;padding:2px 6px;text-transform:none;font:700 10px/1.25 var(--f-sans);letter-spacing:0}
.thread-lbl{fill:var(--text);text-transform:none;font:700 10px var(--f-sans)}
.hub{box-shadow:0 6px 18px -6px color-mix(in srgb,var(--red) 70%,transparent)}
#dock{background:var(--card);border-top:1px solid var(--line);border-radius:0 0 22px 22px;left:0;right:0}
#help{background:var(--card);border:1px solid var(--line);border-radius:16px;top:64px;box-shadow:var(--shadow)}
.hl{font:500 12px/1.4 var(--f-sans)}.hl b{color:var(--text)}
.chip em{color:var(--red);font:700 10px var(--f-sans);letter-spacing:.08em}.chip span{font:500 12.5px/1.45 var(--f-sans)}
.empty{border-radius:14px;font:500 12.5px var(--f-sans)}
.note-box,.disc{border-radius:12px;font:500 12px/1.5 var(--f-sans)}
/* floating toolbar */
#ftb{position:absolute;left:14px;top:14px;z-index:30;display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);cursor:default}
#ftb .vg{display:flex;flex-direction:column;gap:3px}
.vsep{height:1px;background:var(--line);margin:2px 6px}
#ftb button{position:relative;width:38px;height:38px;border:0;border-radius:13px;background:none;color:var(--text);display:flex;align-items:center;justify-content:center}
#ftb button:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
#ftb button[aria-pressed="true"]{background:var(--blue);color:var(--paper)}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--blue);color:var(--paper);font:600 11.5px var(--f-sans);padding:6px 10px;border-radius:9px;z-index:60;pointer-events:none}
#zoombar{position:absolute;right:14px;top:14px;z-index:30;display:flex;align-items:center;gap:2px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);cursor:default}
#zoombar button{border:0;background:none;color:var(--text);height:32px;min-width:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 8px;font:700 12px var(--f-sans)}
#zoombar button:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
#moreMenu{position:absolute;right:14px;top:62px;z-index:40;width:270px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;cursor:default}
.mi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px;font:600 12.5px var(--f-sans)}
.mi .btn{padding:6px 12px}
/* empty canvas card */
.ghost{color:var(--text);z-index:5}
.gcard{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px 28px;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:min(420px,86vw)}
.gcard h2{font:800 26px var(--f-sans);letter-spacing:-.04em}
.gcard p{margin:0;font:500 13px/1.5 var(--f-sans);color:var(--mute)}
.gcard .row{flex-wrap:wrap;justify-content:center;margin-top:6px}
/* items */
.it-heading .tx{font:800 32px/1.05 var(--f-sans);letter-spacing:-.04em;color:var(--text)}
.it-text .tx{font:500 14px/1.55 var(--f-sans);color:var(--text)}
.it-note{border:0;border-radius:6px 6px 14px 6px;box-shadow:0 2px 3px rgba(0,0,0,.08),0 14px 24px -14px rgba(0,0,0,.4);color:#1d1d20}
.it-note.c-yellow,.it-note.c-pink{background:#ffe27a}.it-note.c-pink{background:#ffc3da}.it-note.c-paper{background:#ffffff}.it-note.c-blue{background:#cfe0ff;border:0;box-shadow:0 2px 3px rgba(0,0,0,.08),0 14px 24px -14px rgba(0,0,0,.4)}
.it-note.c-green{background:#bfe8c8}.it-note.c-orange{background:#ffc59e}
.it-note .tx{font:600 13px/1.45 var(--f-sans);color:#1d1d20}
.it-palette{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);padding:10px}
.it-palette .tx{color:var(--mute);font:700 10.5px var(--f-sans);letter-spacing:.08em;text-transform:none}
.pcrow{border-radius:10px;overflow:hidden;gap:0}.pcrow b{font:500 8.5px var(--f-mono);color:var(--mute)}
.it-section{border:1.5px dashed color-mix(in srgb,var(--text) 35%,transparent);border-radius:20px;background:color-mix(in srgb,var(--text) 3%,transparent)}
.it-section .tx{background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--text);font:700 11px var(--f-sans);letter-spacing:0;text-transform:none;padding:3px 10px;margin-top:-6px}
.it.sel{outline-color:var(--red)}
.msel{outline-color:var(--red)}
.marq{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent);border-radius:6px}
.tgchip{background:var(--hl);color:var(--text);border-radius:999px;font:700 10.5px var(--f-sans);text-transform:none;letter-spacing:0;padding:3px 5px 3px 10px}
.tgchip button{color:var(--text)}
/* library, directions, brief */
.lbfil,.lbdet,.lbtop{border-color:var(--line)}
.lbdet{border-left:1px solid var(--line)}
.lc .th{border-radius:14px;overflow:hidden;background:var(--duo-bg)}
.lc b{color:var(--text);font:700 12.5px/1.25 var(--f-sans);text-transform:none;letter-spacing:-.01em}
.lc small{font:500 11px var(--f-sans)}
.lc .bd span{background:var(--blue);color:var(--paper);border-radius:999px;margin:6px 0 0 6px;text-transform:none;letter-spacing:0;font:700 9.5px var(--f-sans);padding:2px 7px}
.lc .plus{background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--text);font:700 10.5px var(--f-sans);text-transform:none;letter-spacing:0}
.lc.sel .th{outline:2.5px solid var(--red);outline-offset:2px}
.lbl2{font:700 10.5px var(--f-sans);letter-spacing:.08em;color:var(--mute)}
.qk button,.chipb{border:1px solid var(--line);border-radius:999px;background:none;font:600 11.5px var(--f-sans);letter-spacing:0;text-transform:none;color:var(--text);padding:5px 11px}
.qk button:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}
.qk button[aria-pressed="true"],.chipb[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.cl button{font:500 12.5px var(--f-sans)}.cl button[aria-pressed="true"]{color:var(--red);font-weight:800}
.preview{border-radius:16px;overflow:hidden;background:var(--wall)}
.preview img{background:var(--wall)}
.pal-row code{font:500 12px var(--f-mono)}
.pal-row small{font:500 10.5px var(--f-mono)}
.dcol{border:1px solid var(--line);border-radius:22px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.dcol.act{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--red)}
.dcol input.dn{font:800 21px var(--f-sans);color:var(--text);letter-spacing:-.04em}
.thumbs div{border-radius:10px;overflow:hidden;background:var(--wall)}
.thumbs img{filter:none;mix-blend-mode:normal}
.stat{border-radius:999px;font:700 10.5px var(--f-sans);text-transform:capitalize;letter-spacing:0;padding:3px 10px;border-color:var(--line);color:var(--text)}
.stat.approved{background:#bfe8c8;border-color:#bfe8c8;color:#17321f}.stat.review{background:var(--hl);border-color:var(--hl);color:var(--text)}
.ana,.terr{border:1px solid var(--line);border-radius:18px;background:var(--card)}
.ana h3{font:700 11px var(--f-sans);letter-spacing:.08em;color:var(--red)}
.ana ul{font:500 13px/1.5 var(--f-sans)}
.trow input{border-radius:9px}
.cmp th{color:var(--text)}.cmp,.cmp td{font:500 12.5px var(--f-sans)}
.terr b{color:var(--text)}
.mbox{border:1px solid var(--line);border-radius:24px;background:var(--card);overflow:hidden}
.tabs button{font:700 12px var(--f-sans);letter-spacing:0;text-transform:none;color:var(--mute)}.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--red)}
.drop{border-radius:16px;border:1.5px dashed var(--line);font:500 13px var(--f-sans)}
.pk{border-radius:12px;overflow:hidden}.pk span{font:500 10.5px var(--f-sans)}
.tst{border-radius:999px;background:var(--blue);color:var(--paper);font:600 12.5px var(--f-sans);padding:10px 16px;box-shadow:var(--shadow)}
.tst button{border-radius:999px;font:700 11px var(--f-sans);text-transform:none;letter-spacing:0}
.dwrap,.bwrap{font-family:var(--f-sans)}
.langwrap{font-family:var(--f-sans)}
.sw span,.pc .blk{border-radius:6px}
/* calendar */
.calpop{position:fixed;top:64px;right:16px;width:352px;max-width:calc(100vw - 24px);max-height:calc(100vh - 80px);overflow:auto;z-index:150;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow),0 30px 60px -30px rgba(0,0,0,.4);padding:16px;display:flex;flex-direction:column;gap:14px}
.calhead{display:flex;align-items:center;gap:10px}
.calhead .ico{width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
.calhead b{display:block;font:800 16px var(--f-sans);letter-spacing:-.02em}.calhead span{font:500 11.5px var(--f-sans);color:var(--mute)}
.calhead .sp{flex:1}
.calnav{display:flex;align-items:center;justify-content:space-between}
.calnav b{font:700 14px var(--f-sans)}
.calnav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--text);display:flex;align-items:center;justify-content:center}
.calnav button:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;justify-items:center}
.calgrid .wd{font:700 10.5px var(--f-sans);color:var(--mute);padding-bottom:2px}
.calgrid button{position:relative;width:38px;height:38px;border-radius:50%;border:1.5px solid transparent;background:var(--cream);color:#1d1d20;font:700 12.5px var(--f-sans);display:flex;align-items:center;justify-content:center}
.calgrid button.out{background:none;border:1.5px dashed var(--line);color:var(--mute);font-weight:500}
.calgrid button:hover{border-color:var(--text)}
.calgrid button.today{background:var(--red);color:#fff}
.calgrid button.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--text)}
.calgrid .dots{position:absolute;bottom:3px;display:flex;gap:2px}
.calgrid .dots i{width:5px;height:5px;border-radius:50%;background:var(--red)}
.calgrid .dots i.c{background:var(--pnk)}.today .dots i{background:#fff}
.calleg{display:flex;gap:14px;font:500 11px var(--f-sans);color:var(--mute)}
.calleg i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:5px}.calleg i.c{background:var(--pnk)}
.calnext{background:var(--yel);color:#17171a;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.calnext small{font:700 11px var(--f-sans);letter-spacing:.02em}
.calnext h3{margin:0;font:800 20px/1.15 var(--f-sans);letter-spacing:-.03em}
.calnext .btn{background:#17171a;color:#fff;border-color:#17171a;align-self:flex-start;padding:6px 14px}
.calnext.none{background:color-mix(in srgb,var(--text) 6%,var(--card));color:var(--text)}
.calday h4{margin:0 0 6px;font:800 13px var(--f-sans)}
.evr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font:600 13px var(--f-sans)}
.evr input{width:16px;height:16px;accent-color:var(--red)}
.evr.done span{text-decoration:line-through;color:var(--mute)}
.evr span{flex:1;min-width:0;overflow-wrap:anywhere}
.evr em{font:600 10.5px var(--f-sans);font-style:normal;background:var(--hl);color:var(--text);border-radius:999px;padding:2px 8px;white-space:nowrap}
.evr button{border:0;background:none;color:var(--mute);font-size:16px}
.evform{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.evform .full{grid-column:1/-1}
.evform input,.evform select{width:100%;max-width:none;border-radius:10px;font:500 12.5px var(--f-sans);padding:8px 10px}
.cthumbs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.cthumbs button{border:0;padding:0;border-radius:10px;overflow:hidden;line-height:0;background:none}
.cthumbs img{width:44px;height:44px;object-fit:cover;display:block}
@media (max-width:900px){
  main{padding:0 8px 8px}
  aside{margin-left:0;margin-top:8px}
  #zoombar{top:auto;bottom:10px}#moreMenu{top:auto;bottom:56px}
  .hrow{padding:8px 12px 4px}.cmd{margin:6px 12px 10px;width:calc(100% - 24px)}
  .dlab{display:none}
}

/* ---------- inspector as a bottom sheet (phones, portrait tablets) ---------- */

html[data-sheet] #panel{

  height:min(calc(var(--app-h,100vh)*.62),560px);padding-top:0;overflow:auto;

}

<script>
(function(){
'use strict';
var KEY='tracery.v2';

var UI={tool:'select',view:'web',sel:null,selType:null,pend:null,vx:40,vy:30,z:1,ink:true,pal:true,cropRef:null,cropDraft:null,cropBak:null};
var $=function(s,r){return (r||document).querySelector(s)};

var imgCache={};

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- image analysis ---------- */
function getImg(ref){
  return new Promise(function(res){
    if(imgCache[ref.id]&&imgCache[ref.id].complete)return res(imgCache[ref.id]);
    var im=new Image();im.onload=function(){imgCache[ref.id]=im;res(im)};im.onerror=function(){res(null)};im.src=ref.src;

}
function hex(r,g,b){return '#'+[r,g,b].map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')}).join('')}
function analyse(im,t){
  var sw=im.naturalWidth,sh=im.naturalHeight;
  var sx=t.x*sw,sy=t.y*sh,w=Math.max(2,t.w*sw),h=Math.max(2,t.h*sh);
  var sc=Math.min(1,72/Math.max(w,h));
  var cw=Math.max(2,Math.round(w*sc)),ch=Math.max(2,Math.round(h*sc));
  var c=document.createElement('canvas');c.width=cw;c.height=ch;
  var x=c.getContext('2d',{willReadFrequently:true});

  var d;try{d=x.getImageData(0,0,cw,ch).data}catch(e){return null}
  var buckets={},n=cw*ch,L=new Float32Array(n),sr=0,sb=0,ss=0,sl=0;
  for(var i=0;i<n;i++){
    var r=d[i*4],g=d[i*4+1],b=d[i*4+2];
    var k=(r>>4)<<8|(g>>4)<<4|(b>>4);
    var bk=buckets[k]||(buckets[k]={n:0,r:0,g:0,b:0});bk.n++;bk.r+=r;bk.g+=g;bk.b+=b;
    var l=.2126*r+.7152*g+.0722*b;L[i]=l;sl+=l;sr+=r;sb+=b;

  var pal=[];
  for(var j=0;j<list.length&&pal.length<5;j++){
    var q=list[j],ok=true;
    for(var m=0;m<pal.length;m++){var p=pal[m];if(Math.hypot(p.r-q.r,p.g-q.g,p.b-q.b)<56){ok=false;break}}
    if(ok)pal.push(q);
  }
  var mean=sl/n,vr=0;for(i=0;i<n;i++)vr+=(L[i]-mean)*(L[i]-mean);
  var sd=Math.sqrt(vr/n),gr=0,gc=0;
  for(var yy=0;yy<ch-1;yy++)for(var xx=0;xx<cw-1;xx++){var o=yy*cw+xx;gr+=Math.abs(L[o]-L[o+1])+Math.abs(L[o]-L[o+cw]);gc+=2}
  gr/=gc||1;
  var warm=(sr-sb)/n,sat=ss/n;
  return {
    palette:pal.map(function(p){return hex(p.r,p.g,p.b)}),
    value:mean<85?'low key':mean<170?'mid value':'high key',
    contrast:sd<28?'flat':sd<58?'moderate contrast':'punchy contrast',
    temp:warm>22?'warm':warm<-22?'cool':'neutral',
    sat:sat<.18?'muted':sat<.45?'balanced chroma':'saturated',
    texture:gr<3?'smooth':gr<9?'soft grain':gr<20?'crisp edges':'busy detail',
    mean:Math.round(mean),sd:Math.round(sd),grad:Math.round(gr*10)/10

}

/* ---------- sample references drawn on canvas ---------- */
function mk(w,h,fn){var c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c.toDataURL('image/jpeg',.86)}

  S.refs=[
    {id:'r1',name:'Harbour at dusk',x:-150,y:-40,w:290,src:a},
    {id:'r2',name:'Weave study',x:640,y:-20,w:310,src:b},

  ];

  S.tags=[
    {id:'t1',ref:'r1',x:.5,y:.4,w:.26,h:.2,label:'Low sun disc',kind:'color',note:'The single hot point against a cold field.'},
    {id:'t2',ref:'r1',x:.02,y:.72,w:.96,h:.26,label:'Black foreground',kind:'shape',note:'Heavy silhouette band, no detail.'},
    {id:'t3',ref:'r2',x:.04,y:.1,w:.46,h:.8,label:'Stripe cadence',kind:'texture',note:'Irregular widths, repeat every ~5.'},
    {id:'t4',ref:'r3',x:.07,y:.37,w:.38,h:.32,label:'Signal block',kind:'color',note:'Flat red square, hard edges.'},
    {id:'t5',ref:'r3',x:.07,y:.06,w:.86,h:.28,label:'EXIT lettering',kind:'type',note:'Heavy grotesque, tight tracking.'}
  ];
  S.links=[
    {id:'l1',a:'t1',b:'h1',rel:'the hot point'},
    {id:'l2',a:'t3',b:'h1',rel:'rhythm'},
    {id:'l3',a:'t4',b:'h1',rel:'signal'},
    {id:'l4',a:'t5',b:'h1',rel:'voice'},
    {id:'l5',a:'t2',b:'t5',rel:'weight and mass'},

  ];
  S.derivs=[
    {id:'d1',tag:'t1',kind:'shape',text:'Perfect circle as the only curve in the system'},
    {id:'d2',tag:'t4',kind:'layout',text:'Accent blocks sized in thirds, never centered'},
    {id:'d3',tag:'t3',kind:'motion',text:'Staggered wipe, 5-step repeat'},
    {id:'d4',tag:'t5',kind:'type',text:'Display in black-weight grotesque, caps only'}

}

/* ---------- colour scheme and mood from pixels ---------- */
function hsl(h){var r=parseInt(h.substr(1,2),16)/255,g=parseInt(h.substr(3,2),16)/255,b=parseInt(h.substr(5,2),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,s=d?d/(1-Math.abs(2*l-1)):0,hh=0;
  if(d){if(mx===r)hh=((g-b)/d)%6;else if(mx===g)hh=(b-r)/d+2;else hh=(r-g)/d+4;hh*=60;if(hh<0)hh+=360}
  return {h:hh,s:s,l:l}}
function dist(a,b){var d=Math.abs(a-b)%360;return d>180?360-d:d}
function schemeOf(pal){
  var cs=[],ne=0;
  (pal||[]).forEach(function(x){var c=hsl(x);if(c.s<.14||c.l<.1||c.l>.93)ne++;else cs.push(c.h)});
  cs.sort(function(a,b){return a-b});
  var cl=[];cs.forEach(function(h){var L=cl[cl.length-1];if(L&&h-L.m<=28){L.m=(L.m*L.n+h)/(L.n+1);L.n++}else cl.push({m:h,n:1})});
  if(cl.length>1&&cl[0].m+360-cl[cl.length-1].m<=28){var f=cl.shift();cl[cl.length-1].m=(cl[cl.length-1].m+f.m+360)/2%360}
  var hues=cl.map(function(c){return Math.round(c.m)%360}),n=hues.length,name,note;

  else if(n===1){name='Monochromatic';note='One hue family'+(ne?' with neutrals':'')}
  else if(n===2){var d=dist(hues[0],hues[1]);name=d>=150?'Complementary':d<=60?'Analogous':'Dual tone';note='Two hues '+d+'° apart'}
  else if(n===3){var ds=[dist(hues[0],hues[1]),dist(hues[1],hues[2]),dist(hues[0],hues[2])].sort(function(a,b){return a-b});
    if(ds[2]<=90){name='Analogous';note='Neighbouring hues'}
    else if(ds[0]>=95&&ds[2]<=145){name='Triadic';note='Three hues evenly spread'}
    else if(ds[0]<=60&&ds[2]>=140){name='Split complementary';note='A pair set against a third'}
    else{name='Polychrome';note='Three unrelated hues'}}
  else{name='Polychrome';note=n+' hue families'}
  return {name:name,hues:hues,neutrals:ne,note:note};
}
function moodOf(a){
  if(!a)return [];var w=[];
  if(a.temp==='warm')w.push(a.sat==='saturated'?'urgent':'warm');else if(a.temp==='cool')w.push(a.value==='low key'?'nocturnal':'calm');else w.push('measured');
  if(a.value==='low key')w.push('heavy');else if(a.value==='high key')w.push('airy');
  if(a.contrast==='punchy contrast')w.push('graphic');else if(a.contrast==='flat')w.push('quiet');
  if(a.sat==='muted')w.push('subdued');else if(a.sat==='saturated')w.push('loud');
  if(a.texture==='smooth')w.push('clean');else if(a.texture==='soft grain')w.push('tactile');else if(a.texture==='busy detail')w.push('dense');else w.push('crisp');

}
function regionBlob(im,t,max){
  var sw=im.naturalWidth,sh=im.naturalHeight,sx=t.x*sw,sy=t.y*sh,w=Math.max(8,t.w*sw),h=Math.max(8,t.h*sh);
  var sc=Math.min(2,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  c.getContext('2d').drawImage(im,sx,sy,w,h,0,0,c.width,c.height);
  return new Promise(function(res){c.toBlob(function(b){res(b)},'image/jpeg',.9)});
}

function hsl2hex(h,s,l){h=((h%360)+360)%360;var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  return hex((r+m)*255,(g+m)*255,(b+m)*255)}

function pixelAt(im,fx,fy){
  var c=document.createElement('canvas');c.width=3;c.height=3;var x=c.getContext('2d',{willReadFrequently:true});
  var px=Math.max(1,Math.min(im.naturalWidth-2,Math.round(fx*im.naturalWidth))),py=Math.max(1,Math.min(im.naturalHeight-2,Math.round(fy*im.naturalHeight)));
  x.drawImage(im,px-1,py-1,3,3,0,0,3,3);var d;try{d=x.getImageData(0,0,3,3).data}catch(e){return null}
  var r=0,g=0,b=0;for(var i=0;i<9;i++){r+=d[i*4];g+=d[i*4+1];b+=d[i*4+2]}return hex(r/9,g/9,b/9);
}
window.TR={hex:hex,rotate:rotate,hsl2hex:hsl2hex,pixelAt:pixelAt,schemeOf:schemeOf,moodOf:moodOf,regionBlob:regionBlob,hsl:hsl,S:S,UI:UI,$:$,uid:uid,save:save,load:load,getImg:getImg,analyse:analyse,sample:sample,KINDS:KINDS,DKINDS:DKINDS};
})();
</script>
<script>
(function(){
'use strict';
var T=window.TR,S=T.S,UI=T.UI,$=T.$,uid=T.uid,CAP=27,HR=22;
var stage=$('#stage'),world=$('#world'),svg=$('#threads'),tg=$('#tg'),sheet=$('#sheet'),panel=$('#panel'),langEl=$('#lang'),main=$('main');
var SAMPLE=null,DL=null,busy={},loadedFonts={},FULL={x:0,y:0,w:1,h:1},armedRef=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ref(id){return S.refs.filter(function(r){return r.id===id})[0]}
function tag(id){return S.tags.filter(function(t){return t.id===id})[0]}
function hub(id){return S.hubs.filter(function(h){return h.id===id})[0]}

function link(id){return S.links.filter(function(l){return l.id===id})[0]}
function cr(r){return UI.cropRef===r.id?FULL:(r.crop||FULL)}
function dAr(r){var c=cr(r);return c.h*(r.ar0||1.2)/c.w}
function refH(r){return r.w*dAr(r)+CAP}
function rectOf(t){
  var r=ref(t.ref);if(!r)return null;var c=cr(r),ar=dAr(r);
  var x0=Math.max(0,(t.x-c.x)/c.w),y0=Math.max(0,(t.y-c.y)/c.h),x1=Math.min(1,(t.x+t.w-c.x)/c.w),y1=Math.min(1,(t.y+t.h-c.y)/c.h);
  if(x1<=x0||y1<=y0)return null;
  return {x:r.x+x0*r.w,y:r.y+CAP+y0*r.w*ar,w:(x1-x0)*r.w,h:(y1-y0)*r.w*ar};
}
function geom(id){
  var h=hub(id);if(h)return {c:{x:h.x,y:h.y},hub:true};
  var t=tag(id),R=t&&rectOf(t);if(!R)return null;return {c:{x:R.x+R.w/2,y:R.y+R.h/2},hw:R.w/2,hh:R.h/2};

function edge(g,to){
  var dx=to.x-g.c.x,dy=to.y-g.c.y,len=Math.hypot(dx,dy)||1;
  if(g.hub)return {x:g.c.x+dx/len*(HR+1),y:g.c.y+dy/len*(HR+1)};
  var k=Math.min(g.hw/Math.abs(dx||1e-6),g.hh/Math.abs(dy||1e-6),1);
  return {x:g.c.x+dx*k,y:g.c.y+dy*k};
}
function loadFont(name){
  if(!name||!/^[A-Za-z0-9 ]{2,40}$/.test(name)||loadedFonts[name])return;loadedFonts[name]=1;
  var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+name.replace(/ /g,'+')+':wght@400;700&display=swap';document.head.appendChild(l);
}

/* ---------- world ---------- */
function applyView(){world.style.transform='translate('+UI.vx+'px,'+UI.vy+'px) scale('+UI.z+')';world.style.setProperty('--iz',String(1/UI.z));var zp=$('#zPct');if(zp)zp.textContent=Math.round(UI.z*100)+'%';stage.style.backgroundSize=(24*UI.z)+'px '+(24*UI.z)+'px';stage.style.backgroundPosition=UI.vx+'px '+UI.vy+'px'}
function placeSheet(){

/* ---------- Claude reading ---------- */
function readWithClaude(t){
  var r=ref(t.ref);if(!r||!SAMPLE||busy[t.id])return;
  busy[t.id]=1;t.readErr='';renderPanel();
  T.getImg(r).then(function(im){return T.regionBlob(im,t,900)}).then(function(blob){
    var sc=t.an?T.schemeOf(t.an.palette):null;
    var prompt='You are helping an art director study one cropped region of a reference image. The tag is called "'+t.label+'" (kind: '+t.kind+')'+(t.note?'; their note: "'+t.note+'"':'')+'. '+
      (t.an?'Pixel analysis already found palette '+t.an.palette.join(', ')+', '+t.an.temp+', '+t.an.value+', '+t.an.texture+', hue scheme '+sc.name+'. ':'')+
      'Reply with only one JSON object: {"typeface":null or {"name":string,"classification":string,"alternates":[string,string],"googleMatch":string,"confidence":number,"features":string},"mood":[3 to 5 single lowercase words],"summary":string}. '+
      'typeface: set it to null unless lettering is clearly visible. name is the best identification, or the nearest known family if unsure. googleMatch is the closest family that exists on Google Fonts, exact spelling. confidence is 0 to 1. classification is a short label such as "grotesque sans", "didone serif", "slab serif", "monospace", "script", "blackletter" or "display". features is one sentence on what distinguishes it (contrast, terminals, proportions). '+
      'mood: the feeling this region carries. summary: one sentence on what this region could contribute to a visual identity.';
    return SAMPLE.json(prompt,{images:[blob],cache:{gcTime:600000}});
  }).then(function(j){
    var tf=j&&j.typeface&&j.typeface.name?j.typeface:null;
    t.read={typeface:tf,mood:(j.mood||[]).slice(0,5).map(String),summary:String(j.summary||'')};
    T.save();
  }).catch(function(e){
    t.readErr=e&&e.code==='not_granted'?'Reading is switched off for this page. Allow Claude access to use it.':e&&e.code==='rate_limited'?'Too many reads. Wait a moment and try again.':e&&e.code==='images_unavailable'?'This view cannot send images to Claude.':'The reading did not come back. Try again.';
  }).then(function(){delete busy[t.id];if(UI.sel===t.id)renderPanel()});
}

/* ---------- crop ---------- */
function startCrop(id){
  var r=ref(id);if(!r||UI.cropRef)return;
  var c=r.crop||FULL,Wf=r.w/c.w,Hf=Wf*(r.ar0||1.2);
  UI.cropBak={x:r.x,y:r.y,w:r.w,crop:r.crop?{x:c.x,y:c.y,w:c.w,h:c.h}:null};
  r.x-=c.x*Wf;r.y-=c.y*Hf;r.w=Wf;
  UI.cropRef=id;UI.cropDraft={x:c.x,y:c.y,w:c.w,h:c.h};
  setTool('select');renderWorld();renderPanel();
}
function applyCrop(){
  var r=ref(UI.cropRef);if(!r)return;
  var d=UI.cropDraft,Wf=r.w,Hf=Wf*(r.ar0||1.2);
  var full=d.w>.995&&d.h>.995&&d.x<.005&&d.y<.005;
  r.x+=d.x*Wf;r.y+=d.y*Hf;r.w=Wf*d.w;r.crop=full?null:{x:d.x,y:d.y,w:d.w,h:d.h};
  UI.cropRef=null;UI.cropDraft=null;UI.cropBak=null;
  T.save();analyseRef(r);renderWorld();renderPanel();

/* ---------- thread geometry, curves ---------- */
function chordInfo(l){

  return {len:len,px:-dy/len,py:dx/len,mx:(a.c.x+b.c.x)/2,my:(a.c.y+b.c.y)/2};
}

  var off=ci.len*.22*(k==='arc2'?-1:1);l.bx=ci.px*off;l.by=ci.py*off;
}
function bendPct(l){

  return Math.round(clamp(((l.bx||0)*ci.px+(l.by||0)*ci.py)/(ci.len/2)*100,-100,100));

function linkGeom(l){

    h:curved?{x:mx+bx,y:my+by}:{x:(p.x+q.x)/2,y:(p.y+q.y)/2},
    d:curved?'M'+p.x+' '+p.y+' Q'+cx+' '+cy+' '+q.x+' '+q.y:'M'+p.x+' '+p.y+' L'+q.x+' '+q.y};

function bezPt(g,t){

function spotLocal(im,c){
  var G=24,cv=document.createElement('canvas');cv.width=G;cv.height=G;var x=cv.getContext('2d',{willReadFrequently:true});

  var d;try{d=x.getImageData(0,0,G,G).data}catch(e){return []}

  for(i=0;i<n;i++){mr+=d[i*4];mg+=d[i*4+1];mb+=d[i*4+2]}mr/=n;mg/=n;mb/=n;
  var s1=[],s2=[];
  for(i=0;i<n;i++){
    var r=d[i*4],g=d[i*4+1],b=d[i*4+2],px=i%G,py=Math.floor(i/G),grad=0;

}

function lbList(){
  var u=libUsage(),L=P.lib.filter(function(l){return lbMatch(l,u)});
  if(LBF.ai){var ix={};LBF.ai.ids.forEach(function(id,i){ix[id]=i});L=L.filter(function(l){return ix[l.id]!==undefined}).sort(function(a,b){return ix[a.id]-ix[b.id]});return L}
  var order=function(l){return P.lib.indexOf(l)};
  if(LBF.sort==='name')L.sort(function(a,b){return a.title.localeCompare(b.title)});
  else if(LBF.sort==='pinned')L.sort(function(a,b){return (b.pin-a.pin)||(order(b)-order(a))});
  else L.sort(function(a,b){return (a.collected<b.collected?1:a.collected>b.collected?-1:0)||(order(b)-order(a))});
  return L;
}
function uniqSorted(a){return a.filter(function(x,i){return x&&a.indexOf(x)===i}).sort()}

document.addEventListener('keydown',function(e){
  var t=e.target;if(!t.matches||!(t.matches('[data-ltagin]')||t.matches('[data-lcatin]')))return;
  if(e.key!=='Enter'&&e.key!==',')return;e.preventDefault();
  var li=libOf(t.closest('[data-lid]').dataset.lid),v=t.value.trim();if(!li||!v)return;
  if(t.matches('[data-ltagin]')){splitTags(v).forEach(function(x){if(li.tags.indexOf(x)<0)li.tags.push(x)})}
  else if(li.cats.indexOf(v)<0)li.cats.push(v);
  T.save();libRefresh();
});
function copyHex(h){
  var done=function(){toast('Copied '+hexUp(h))};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(h.toUpperCase()).then(done,function(){toast(hexUp(h)+' (copy blocked here, select it by hand)')});else toast(hexUp(h));
}
function paletteText(li){
  var s=li.title+'\n'+li.palette.map(function(h){return hexUp(h)+'  '+rgbStr(h)+'  '+cmykStr(h)}).join('\n')+'\n\nCMYK values are an uncalibrated conversion.\n\n:root{\n'+li.palette.map(function(h,i){return '  --colour-'+(i+1)+': '+h+';'}).join('\n')+'\n}\n';
  return s;
}
function libAction(li,a,btn){
  if(a==='fav'){li.fav=!li.fav;T.save();libRefresh();return}
  if(a==='pin'){li.pin=!li.pin;T.save();libRefresh();return}
  if(a==='addcol'){var v=$('#lpNew')?$('#lpNew').value:'#e4414b';if(li.palette.indexOf(v)<0)li.palette.push(v);T.save();libRefresh();return}
  if(a==='reextract'){assetImg(li.aid).then(function(im){var p=im&&extractPalette(im,6);if(p){li.palette=p;T.save();libRefresh();toast('Colours re-read from the image.')}else toast('The colours could not be read from this image.')});return}
  if(a==='toboard'){
    if(!li.palette.length){toast('This reference has no colours yet.');return}
    var c=UI.view==='web'?viewCentre():nextPos();addItem('palette',c.x-190,c.y-55,{text:li.title,sw:li.palette.slice(0,8)});
    toast('Palette card added to “'+curBoard().name+'”.');return;
  }
  if(a==='toproj'){P.sw=P.sw||[];var n=0;li.palette.forEach(function(h){if(P.sw.indexOf(h)<0){P.sw.push(h);n++}});T.save();toast(n?'Saved '+n+' colours to this project.':'Those colours are already saved.');return}
  if(a==='export'){if(!li.palette.length){toast('No colours to export.');return}saveFile((li.title||'palette').replace(/[^\w-]+/g,'-').toLowerCase()+'-palette.txt',paletteText(li),'text/plain');return}
  if(a==='addboard'){var r=addRefToBoard(li);if(r){toast('Added to “'+curBoard().name+'”.');if(UI.view==='web'){fit();select('ref',r.id)}}return}
  if(a==='delete'){
    if(lbArm!==li.id){lbArm=li.id;btn.textContent='Click again to remove';setTimeout(function(){lbArm=null;if(btn)btn.textContent='Remove from library'},3000);return}
    lbArm=null;removeLib(li.id);return;
  }
}
function removeLib(id){
  stash();var li=libOf(id),n=0;
  P.boards.forEach(function(b){var d=b.data;d.refs.filter(function(r){return r.lib===id}).forEach(function(r){d.tags.filter(function(t){return t.ref===r.id}).forEach(function(t){d.links=d.links.filter(function(l){return l.a!==t.id&&l.b!==t.id});d.derivs=d.derivs.filter(function(x){return x.tag!==t.id})});d.tags=d.tags.filter(function(t){return t.ref!==r.id});n++});d.refs=d.refs.filter(function(r){return r.lib!==id})});
  P.lib=P.lib.filter(function(l){return l.id!==id});loadBoard(curBoard());if(LBF.sel===id)LBF.sel=null;
  T.save();renderAll();toast('Removed “'+(li?li.title:'reference')+'”'+(n?' and its '+n+' board copies.':'.')+' The image file stays in your backup history only.');
}
document.addEventListener('click',function(e){
  var w=e.target.closest&&e.target.closest('[data-lid]'),li=w&&libOf(w.dataset.lid);

    var g=function(s){return e.target.closest(s)},x;

    if(x=g('[data-lcat]')){var c=x.dataset.lcat,i=li.cats.indexOf(c);if(i>-1)li.cats.splice(i,1);else li.cats.push(c);T.save();libRefresh();return}

function libAi(){
  if(!SAMPLE||LBF.aiBusy)return;
  var q=prompt_q();if(!q)return;
  var items=P.lib.slice(-250).map(function(l){return [l.id,l.title,l.creator,l.tags.join('/'),l.cats.join('/'),(l.takeaway||'').slice(0,140),(l.notes||'').slice(0,140),l.palette.slice(0,4).join(' ')].join(' | ')});
  LBF.aiBusy=true;LBF.aiErr='';renderLibTop();
  var pr='You help an art director search their saved reference library. You only see the text metadata below, never the images. Each line is: id | title | creator | tags | what-it-references | takeaway | notes | colours. '+
    'The director asks: "'+q.replace(/"/g,"'")+'". Choose up to 12 lines that best match, best first. Do not invent ids. Reply with only JSON: {"ids":[id,...],"why":{"<id>":"under 12 words on why it fits"}}. If nothing fits, return {"ids":[],"why":{}}.\n\n'+items.join('\n');
  SAMPLE.json(pr,{cache:{gcTime:300000}}).then(function(j){

function pinParse(text){
  var seen={},out=[];
  String(text||'').split(/\r?\n/).forEach(function(line){
    var urls=line.match(PINRE.any)||[];if(!urls.length)return;
    var img=null,pin=null,sh=null;

      if(PINRE.img.test(u)&&!img)img=u;else if(PINRE.pin.test(u)&&!pin)pin=u.split('?')[0];else if(PINRE.short.test(u)&&!sh)sh=u;else if(!pin&&!img&&!sh&&/^https?:/.test(u))img=img||null});

  });
